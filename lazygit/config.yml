  # - key: "h"
  #   context: "commitFiles"
  #   description: "Только хеши коммитов для этого файла"
  #   command: "git log --format='%h' -- '{{.SelectedCommitFile.Name}}'"
  #   output: "terminal"

  - key: "h"
    context: "commitFiles"
    description: "Хеши коммитов для файла"
    command: "git log --format='%h %s' -- '{{.Form.FilePath}}'"
    output: "terminal"
    prompts:
      - type: "input"
        title: "Путь к файлу:"
        key: "FilePath"
        initialValue: "{{.SelectedCommitFile.Name}}"

  - key: "d" # Например, клавиша 'd' для Diff
    context: "commitFiles" # Работаем с файлами внутри конкретного коммита
    description: "Сравнить этот файл с HEAD (или другим коммитом)"
    command: "git diff {{.Form.OldCommit}} {{.Form.NewCommit}} -- '{{.SelectedCommitFile.Name}}'"
    output: "terminal" # Или "popup", но terminal лучше для внешнего diff
    prompts:
      - type: "input"
        title: "Старый коммит (или диапазон, например HEAD~3):"
        key: "OldCommit"
        initialValue: "HEAD" # По умолчанию сравниваем с текущим состоянием
      - type: "input"
        title: "Новый коммит:"
        key: "NewCommit"
        initialValue: "{{.SelectedCommit.Hash}}" # По умолчанию берем хеш коммита, в котором мы находимс
