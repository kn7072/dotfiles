  - key: "<c-a>"
    context: "commits"
    description: "Diff файлов выбранного коммита между двумя коммитами"
    command: "git diff-tree --no-commit-id --name-only -z -r {{.Form.Commit1}} | xargs -0 git diff {{.Form.Commit1}} {{.Form.Commit2}} --"
    output: "terminal"
    prompts:
      - type: "input"
        title: "Первый коммит (источник файлов):"
        key: "Commit1"
        initialValue: "{{.SelectedCommit.Hash}}"
      - type: "input"
        title: "Второй коммит для сравнения:"
        key: "Commit2"
        initialValue: "HEAD"

  - key: "a"
    command: "echo {{.Form.BranchType | quote}}"
    context: "commitFiles"
    prompts:
      - type: "input" # <-- меняем на input
        title: "What kind of branch is it?"
        key: "BranchType"
        initialValue: "{{.SelectedCommitFile.Name}}" # <-- шаблон сработает здесь

  # - key: "h" # Можете заменить на любую удобную клавишу
  #   context: "commitFiles"
  #   description: "История изменений этого файла"
  #   # Обратите внимание на кавычки вокруг {{.Form.FilePath}} - это защитит от ошибок, если в пути есть пробелы
  #   command: "git log --follow -- '{{.Form.FilePath}}'"
  #   output: "terminal" # Откроет вывод в терминале, чтобы можно было листать (q для выхода)
  #   prompts:
