gui:
  # If true, show the number of lines changed per file in the Files view
  showNumstatInFilesView: true
  # If true, increase the height of the focused side window; creating an accordion effect.
  expandFocusedSidePanel: true
  # The weight of the expanded side panel, relative to the other panels. 2 means
  # twice as tall as the other panels. Only relevant if `expandFocusedSidePanel` is true.
  expandedSidePanelWeight: 4
  # Length of author name in (non-expanded) commits view. 2 means show initials only.
  commitAuthorShortLength: 3
  theme:
    # Background color of selected line.
    selectedLineBgColor:
      - "#575859"
    # Border color of focused window
    activeBorderColor:
      - "#fa8ce2"
      # - red
      # - blue
      - bold
    inactiveBorderColor:
      - green
    # - blue
    # - default

    # os:
    #   editPreset: "nvim"
    authorColors:
      # use red for John Smith
      "stepan": "cyan"
      # use blue for other authors,
      "*": "#fbff00"
# комманды работают только в если запустить lazygit в терминале, а не через yazi
customCommands:
  - key: "<c-k>"
    command: "git --no-pager log --follow -- '**/keymap.c'"
    context: "global"
    description: "История всех keymap.c"
    output: "popup"

  - key: "<c-l>"
    command: "git --no-pager log --follow -- '**/keymap.c'"
    # command: "git log -- ':(glob)**/keymap.c'"
    context: "global"
    description: "История всех keymap.c"
    # output: "logWithPty"
    output: terminal
